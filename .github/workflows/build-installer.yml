name: Build TechZone Installer

on:
  # 1. التشغيل التلقائي عند رفع إصدار جديد (Tag) يبدأ بحرف v مثل v2.0.5
  push:
    tags:
      - 'v*'
  # 2. إمكانية التشغيل اليدوي بضغطة زر من تبويب Actions في GitHub
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (اتركه فارغاً للتوليد التلقائي)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. جلب كود المشروع
        uses: actions/checkout@v4

      - name: 2. تجهيز بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. تثبيت المكتبات المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: 4. تحديد رقم الإصدار تلقائياً
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            # يولد رقماً فريداً تلقائياً في كل تشغيل مثل 2.0.1 ثم 2.0.2
            $v = "2.0.${{ github.run_number }}"
          }
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV
          echo "Building version: $v"

      - name: 5. بناء البرنامج التنفيذي (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --name TechZone --windowed --onefile --icon "icon.ico" --add-data "web;web" --add-data "icon.ico;." app\main.py

      - name: 6. تجميع ملف السطب (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\TechZone.iss"

      - name: 7. توليد بصمة التحقق SHA-256
        shell: pwsh
        run: |
          Get-ChildItem 'dist\TechZone*.exe' | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding UTF8 'dist\SHA256SUMS.txt'

      - name: 8. حفظ الملفات للتحميل المباشر (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TechZone-Setup-v${{ env.APP_VERSION }}
          path: |
            dist/TechZone-Setup-v${{ env.APP_VERSION }}.exe
            dist/SHA256SUMS.txt

      - name: 9. نشر الإصدار في صفحة Releases تلقائياً
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TechZone-Setup-v${{ env.APP_VERSION }}.exe
            dist/SHA256SUMS.txt